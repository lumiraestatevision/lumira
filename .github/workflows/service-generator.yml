# 3D-Modell mit Blender (Port 8005) – ruft den gemeinsamen Workflow _python-service.yml auf.
name: generator

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "services/generator/**"
      - "packages/shared/**"
      - "uv.lock"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/_python-service.yml"
      - ".github/workflows/service-generator.yml"
  pull_request:
    paths:
      - "services/generator/**"
      - "packages/shared/**"
      - "uv.lock"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/_python-service.yml"
      - ".github/workflows/service-generator.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service:
    uses: ./.github/workflows/_python-service.yml
    permissions:
      contents: read
      packages: write
    with:
      service: generator

  # Servicespezifisch: echter Export mit Blender 4.5 LTS im dev-Image (enthält Blender + pytest).
  blender-export:
    name: blender export
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: dev-Image bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/generator/Dockerfile
          target: dev
          tags: lumira-generator:ci
          load: true
          cache-from: type=gha,scope=generator-dev
          cache-to: type=gha,mode=max,scope=generator-dev
      - name: Blender-Export testen (pytest -m blender)
        run: >-
          docker run --rm -w /app/services/generator lumira-generator:ci
          pytest -m blender -v -p no:cacheprovider
