# Raumklassifikation (Port 8003) – ruft den gemeinsamen Workflow _python-service.yml auf.
name: classifier

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "services/classifier/**"
      - "packages/shared/**"
      - "uv.lock"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/_python-service.yml"
      - ".github/workflows/service-classifier.yml"
  pull_request:
    paths:
      - "services/classifier/**"
      - "packages/shared/**"
      - "uv.lock"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/_python-service.yml"
      - ".github/workflows/service-classifier.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service:
    uses: ./.github/workflows/_python-service.yml
    permissions:
      contents: read
      packages: write
    with:
      service: classifier
