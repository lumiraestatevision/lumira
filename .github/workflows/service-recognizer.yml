# Planerkennung (Port 8002) – ruft den gemeinsamen Workflow _python-service.yml auf.
name: recognizer

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "services/recognizer/**"
      - "packages/shared/**"
      - "uv.lock"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/_python-service.yml"
      - ".github/workflows/service-recognizer.yml"
  pull_request:
    paths:
      - "services/recognizer/**"
      - "packages/shared/**"
      - "uv.lock"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/_python-service.yml"
      - ".github/workflows/service-recognizer.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service:
    uses: ./.github/workflows/_python-service.yml
    permissions:
      contents: read
      packages: write
    with:
      service: recognizer
      build-args: TORCH_VARIANT=cpu

  # Servicespezifisch: GPU-Image (CUDA 13, ≈ 9,5 GB) nur auf Knopfdruck bzw. bei Release-Tags –
  # zu groß für jeden Push. Lint/Tests liefen bereits im Job "service".
  gpu-image:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs: service
    uses: ./.github/workflows/_python-service.yml
    permissions:
      contents: read
      packages: write
    with:
      service: recognizer
      build-args: TORCH_VARIANT=cu130
      image-suffix: -cu130
      skip-check: true
      free-disk-space: true
      layer-cache: false
