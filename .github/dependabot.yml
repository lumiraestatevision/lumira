# Wöchentliche, gebündelte Update-PRs – jede läuft durch dieselbe CI wie eigene Änderungen.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv  # alle Workspace-Pakete über das gemeinsame uv.lock
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Nur uv.lock aktualisieren – die Mindestversionen in den pyproject.toml bleiben stehen
    # (sonst ein PR je Paket, der nur ">=" anhebt).
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm  # Frontend (pnpm-lock.yaml)
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Typen passend zur Laufzeit (Node 24) – Major-Sprung erst mit dem Node-Update.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript-Majors (z. B. 7 = neuer Compiler) erst, wenn Next.js sie unterstützt.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker  # Basis-Images der Dockerfiles
    directories:
      - /services/*
      - /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
