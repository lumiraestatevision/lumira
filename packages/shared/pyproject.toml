[project]
name = "lumira-shared"
version = "0.1.0"
description = "Gemeinsame Datenmodelle, Events, Redis-Streams- und S3-Helfer für alle Lumira-Services"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "redis>=6.0",
  "boto3>=1.40",
  "structlog>=25.1",
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.0",
  "httpx2>=2.13",
  "fakeredis>=2.30",
  "moto[s3]>=5.1",
  "types-boto3[s3]>=1.40",
  "ruff>=0.12",
  "pyright>=1.1.400",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
