# Optional: Generator mit NVIDIA-GPU – Licht einbrennen ~20x schneller (mehr Samples, weniger
# Rauschen). Braucht das NVIDIA Container Toolkit (wie Ollama). Einschalten in .env:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
#
# Ohne GPU läuft alles unverändert auf der CPU (weniger Samples, siehe BAKE_SAMPLES).
services:
  generator:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
