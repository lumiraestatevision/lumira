[project]
name = "lumira-parser"
version = "0.1.0"
description = "Lumira Parser: DWG/DXF- und PDF-Grundrisse einlesen (Port 8001)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lumira-shared",
  "ezdxf>=1.4",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "pillow>=11.0",
]
# Nur permissive Lizenzen: pdfplumber (MIT) für Vektoren/Text, pypdfium2 (Apache-2.0/BSD-3)
# zum Rendern. Kein PyMuPDF (AGPL-3.0), kein pdf2image/poppler (Systemabhängigkeit, GPL).

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.0",
  "httpx2>=2.13",
  "fakeredis>=2.30",
  "moto[s3]>=5.2.3",
  "pypdf>=5.0",
  "ruff>=0.12",
  "pyright>=1.1.400",
]

[tool.uv.sources]
lumira-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
