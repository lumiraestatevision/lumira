[project]
name = "lumira-unreal"
version = "0.1.0"
description = "Lumira Unreal: Rendering und VR-Export – lokal nur Stub, echter Betrieb auf GPU-Server (Port 8006)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lumira-shared",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "fakeredis>=2.30",
  "moto[s3]>=5.1",
  "ruff>=0.12",
  "pyright>=1.1.400",
]

[tool.uv.sources]
lumira-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
