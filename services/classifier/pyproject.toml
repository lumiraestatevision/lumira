[project]
name = "lumira-classifier"
version = "0.1.0"
description = "Lumira Classifier: Raumtypen klassifizieren, deutsches Label-Mapping (Port 8003)"
requires-python = ">=3.12,<3.13"
# Kein EasyOCR/torch: Die Texterkennung passiert bereits im recognizer (ein OCR-Modell im
# System statt zwei). Der classifier arbeitet auf erkannten Labels und Raumgeometrie.
dependencies = [
  "lumira-shared",
  "scikit-learn>=1.6",
  "numpy>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.0",
  "httpx2>=2.13",
  "fakeredis>=2.30",
  "moto[s3]>=5.2.3",
  "ruff>=0.12",
  "pyright>=1.1.400",
]

[tool.uv.sources]
lumira-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
