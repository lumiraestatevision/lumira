# Alembic-Konfiguration des backends.
# Die Datenbank-URL kommt aus DATABASE_URL (siehe migrations/env.py), nicht aus dieser Datei.
#
#   cd services/backend
#   uv run alembic upgrade head                         # Migrationen anwenden
#   uv run alembic revision --autogenerate -m "..."     # neue Migration aus Modelländerungen
#   uv run alembic check                                # Modelle == Migrationen?

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
